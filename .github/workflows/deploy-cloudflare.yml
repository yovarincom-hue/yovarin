name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'migrations/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'next.config.mjs'
      - 'open-next.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || { echo "::error::Set the NEXT_PUBLIC_TURNSTILE_SITE_KEY repository variable."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply yovarin-db --remote

      - name: Build and deploy Worker
        run: npm run cf:deploy
