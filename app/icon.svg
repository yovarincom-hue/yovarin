<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 24K Royal Gold Gradient - Light Facet -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="30%" stop-color="#f5e1b5" />
      <stop offset="70%" stop-color="#d9b671" />
      <stop offset="100%" stop-color="#b88a38" />
    </linearGradient>

    <!-- 24K Royal Gold Gradient - Shadow Facet -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf9b" />
      <stop offset="40%" stop-color="#b88a38" />
      <stop offset="85%" stop-color="#805618" />
      <stop offset="100%" stop-color="#54370a" />
    </linearGradient>

    <!-- Obsidian & Midnight Caviar Background -->
    <radialGradient id="bg-radial" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f1624" />
      <stop offset="60%" stop-color="#060911" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Emerald Gemstone Radiant Gradient -->
    <radialGradient id="emerald-gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Drop Shadow for Monogram Depth -->
    <filter id="monogram-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Outer Beveled Octagonal Medallion Base -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#bg-radial)" stroke="url(#gold-light)" stroke-width="1.75" />
  
  <!-- Inner Delicate Hairline Guilloche Lattice Frame -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="url(#gold-dark)" stroke-width="0.75" stroke-dasharray="6 2" opacity="0.6" />

  <!-- Four Micro Corner Cornerstones (Art Deco Accents) -->
  <circle cx="8" cy="8" r="1" fill="#f5e1b5" opacity="0.8" />
  <circle cx="56" cy="8" r="1" fill="#f5e1b5" opacity="0.8" />
  <circle cx="8" cy="56" r="1" fill="#f5e1b5" opacity="0.8" />
  <circle cx="56" cy="56" r="1" fill="#f5e1b5" opacity="0.8" />

  <!-- 3D Faceted Y Monogram with Shadow -->
  <g filter="url(#monogram-shadow)">
    <!-- Top Crown Micro Star / Chevron Accent -->
    <polygon points="32,11 34.5,15 32,14 29.5,15" fill="#fff8eb" opacity="0.9" />

    <!-- Left Wing (Light Beveled Facet) -->
    <polygon points="16,17 32,32 32,37 25,27 19,17" fill="url(#gold-light)" />
    <!-- Left Wing Bevel Highlight -->
    <polygon points="16,17 19,17 32,32 29,32" fill="#fff8eb" opacity="0.7" />

    <!-- Right Wing (Deep Shadow Facet) -->
    <polygon points="48,17 32,32 32,37 39,27 45,17" fill="url(#gold-dark)" />
    <!-- Right Wing Outer Edge -->
    <polygon points="45,17 48,17 35,32 32,32" fill="url(#gold-light)" opacity="0.8" />

    <!-- Center Wing Infill -->
    <polygon points="25,27 32,34 39,27 32,23" fill="url(#gold-light)" opacity="0.95" />

    <!-- Center Vertical Stem - Left Highlight Facet -->
    <polygon points="29.5,34 32,34 32,50 29.5,48.5" fill="url(#gold-light)" />

    <!-- Center Vertical Stem - Right Shadow Facet -->
    <polygon points="32,34 34.5,34 34.5,48.5 32,50" fill="url(#gold-dark)" />

    <!-- Bottom Stem Gold Pedestal / Terminal Serif -->
    <polygon points="27.5,48 36.5,48 35.5,50.5 28.5,50.5" fill="url(#gold-light)" />

    <!-- Radiant Emerald Jewel Centerpiece (The Heart of Yovarin) -->
    <polygon points="32,26.5 36.5,31 32,35.5 27.5,31" fill="url(#emerald-gem)" stroke="#fff8eb" stroke-width="0.75" />
    <!-- Gemstone Diamond Glint -->
    <circle cx="30.5" cy="29.5" r="0.8" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
